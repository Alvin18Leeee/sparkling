name: CI

on:
  push:
    # develop = 集成分支：合入即跑质量门；main = 可发布线（发版最后防线）
    branches: [main, develop]
  pull_request:

# 同分支新推送自动取消旧运行（省额度）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: 核心（Ubuntu：fmt + clippy + 测试）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: rustup component add rustfmt clippy
      - name: 格式检查
        run: cargo fmt --all -- --check
      - name: Clippy（核心库）
        run: cargo clippy -p sparkling-core --all-targets -- -D warnings
      - name: 核心测试
        run: cargo test -p sparkling-core

  app:
    name: 应用（Windows：前端构建 + 全量编译 + 测试）
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: Swatinem/rust-cache@v2
      - run: rustup component add clippy
      - name: 前端依赖与构建（tsc + vite，产出 dist 供 cargo 嵌入）
        run: |
          npm install
          npm run build
      - name: Clippy（全 workspace，含 cfg(windows) 的 DWM 代码）
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: 全量编译（真实链接验证：tauri 壳 + exe 资源嵌入）
        run: cargo build --workspace
      - name: 核心测试（Windows 路径回归）
        run: cargo test -p sparkling-core

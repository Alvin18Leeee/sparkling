[package]
name = "sparkling"
version = "0.1.0"
edition = "2021"
description = "Sparkling 下载器"

[lib]
name = "sparkling_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 事件转发（broadcast RecvError 按变体匹配）、probe_video 三臂 select!/pin!
# （macros）+ 60s sleep（time）、import_cookies 一次性进程调用（process）——
# 均需作为直接依赖引用；sparkling-core 已启用 full，特性并集下无额外编译成本
tokio = { version = "1", features = ["sync", "macros", "time", "process"] }
sparkling-core = { path = "../crates/sparkling-core" }

[target.'cfg(windows)'.dependencies]
# 标题栏 DWM 染色与图标隐藏（windows-sys 已在依赖树中，零额外编译）
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
] }

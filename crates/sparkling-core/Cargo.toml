[package]
name = "sparkling-core"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = true, features = ["stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled"] }
md-5 = "0.10"
base64 = "0.22"
async-trait = "0.1"
fs2 = "0.4"
percent-encoding = "2"
bytes = "1"
tracing = "0.1"
futures = "0.3"

[dev-dependencies]
# start_paused 测试需要 test-util（不在 full 里）
tokio = { version = "1", features = ["test-util"] }
axum = "0.7"
tempfile = "3"
sha2 = "0.10"

# tests/common/mod.rs 是共享模块（Task 7+ 各测试文件 `mod common;` 引用），
# cargo 自动发现只认 tests/*.rs 与 tests/*/main.rs，需显式声明才能
# `cargo test --test common` 单独跑其中的冒烟测试
[[test]]
name = "common"
path = "tests/common/mod.rs"
